services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: motoservice
      POSTGRES_USER: motoservice
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-demo-only}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - motoservice_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motoservice -d motoservice"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    profiles: ["full"]
    environment:
      DB_URL: jdbc:postgresql://db:5432/motoservice
      DB_USER: motoservice
      DB_PASSWORD: ${DB_PASSWORD:-local-demo-only}
      SERVER_ADDRESS: 0.0.0.0
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  motoservice_data:
