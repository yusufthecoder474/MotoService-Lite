spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  flyway:
    clean-disabled: true
    validate-on-migrate: true
server:
  address: 0.0.0.0
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
app:
  demo: false
