<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MotoService Lite</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><header><a class="brand" href="/">MOTO<span>SERVICE</span> <small>LITE</small></a><nav><a href="/">Dashboard</a><a href="/slots">Service slots</a><a href="/motorcycles/new">Add motorcycle</a><form th:action="@{/logout}" method="post"><button class="quiet">Log out</button></form></nav></header><main><div class="alert success" role="status" th:if="${success}" th:text="${success}"></div><div class="alert error" role="alert" th:if="${error}" th:text="${error}"></div><div class="eyebrow">YOUR GARAGE</div><h1>Register a motorcycle</h1><section class="narrow"><form th:action="@{/motorcycles}" method="post"><label for="registration">Registration number</label><input id="registration" name="registration" required minlength="4" maxlength="20" placeholder="DEMO1001"><label for="model">Model</label><input id="model" name="model" required maxlength="80" placeholder="Fictional Roadster"><label for="note">Note (optional)</label><textarea id="note" name="note" maxlength="500"></textarea><button>Save motorcycle</button></form></section></main><footer>Independent student prototype · Fictional workshops · One appointment = one capacity unit</footer></body></html>
